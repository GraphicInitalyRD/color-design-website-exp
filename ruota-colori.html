<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hair Color Wheel - Color Design</title>
<link rel="stylesheet" href="site.css">
<style>
  :root{ --ink:#f5f5f5; }
  /* pannello scuro della ruota, tra header e footer del sito */
  .wheel-main{
    background:radial-gradient(120% 90% at 50% 0%, #1c2128 0%, #111418 70%);
    color:var(--ink); -webkit-tap-highlight-color:transparent;
  }
  .wheel-hint{ text-align:center; padding:12px 16px 2px; font-size:11px; letter-spacing:.5px;
    opacity:.55; pointer-events:none; user-select:none; }
  /* il titolo "HAIR COLOR WHEEL" è più lungo delle altre pagine: lo rimpicciolisco per farlo stare nella barra */
  #site-header .topbar-title{ font-size:12px; letter-spacing:.6px; }

  .stage{ position:relative; height:74vh; min-height:580px; overflow:hidden; }
  #wheel{ position:absolute; inset:0; width:100%; height:100%; display:block; cursor:grab; touch-action:none; }
  #wheel.dragging{ cursor:grabbing; }

  .pointer{
    position:absolute; top:4px; left:50%; transform:translateX(-50%);
    width:0; height:0; z-index:5; pointer-events:none;
    border-left:18px solid transparent; border-right:18px solid transparent;
    border-top:32px solid #ffffff;
    filter:drop-shadow(0 3px 5px rgba(0,0,0,.6));
  }

  .controls{
    flex:0 0 auto; display:flex; justify-content:center; align-items:center;
    gap:14px; padding:12px 16px calc(16px + env(safe-area-inset-bottom));
    position:relative; z-index:6;
  }
  .btn-spin{
    appearance:none; border:none; cursor:pointer;
    font-family:var(--font-main); font-size:15px; font-weight:700; letter-spacing:2px;
    text-transform:uppercase; color:#111; background:#ffffff;
    padding:13px 36px; border-radius:40px;
    box-shadow:0 6px 18px rgba(0,0,0,.4); transition:transform .08s ease, box-shadow .2s;
  }
  .btn-spin:active{ transform:translateY(2px); box-shadow:0 3px 10px rgba(0,0,0,.4); }
  .hint{ font-size:11px; opacity:.45; letter-spacing:.3px; }

  .ciocca-overlay{
    position:fixed; inset:0; display:none; flex-direction:column;
    align-items:center; justify-content:center; gap:14px;
    background:rgba(0,0,0,.72); z-index:1000; cursor:zoom-out;
    -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);
  }
  .ciocca-overlay.show{ display:flex; animation:fade .18s ease; }
  @keyframes fade{ from{opacity:0} to{opacity:1} }
  .ciocca-overlay img{
    width:288px; height:384px; max-width:86vw; max-height:60vh; object-fit:contain;
    border-radius:10px; box-shadow:0 14px 40px rgba(0,0,0,.6); background:#fff;
  }
  .win-code{ font-size:22px; letter-spacing:3px; font-weight:700; text-transform:uppercase; }
  .win-name{ font-size:12px; letter-spacing:1px; opacity:.7; margin-top:-8px; text-transform:uppercase; }
  .again{
    appearance:none; border:1px solid rgba(255,255,255,.6); background:transparent;
    color:#fff; font-family:var(--font-main); font-size:12px; letter-spacing:2px;
    text-transform:uppercase; padding:10px 22px; border-radius:30px; cursor:pointer; margin-top:6px;
  }
  .again:active{ background:rgba(255,255,255,.12); }
</style>
</head>
<body>
  <div class="page">
    <div id="site-header" data-title="HAIR COLOR WHEEL" data-active="wheel"></div>

    <main class="wheel-main">
      <p class="wheel-hint">Drag with your finger or press SPIN &middot; the colour under the arrow wins</p>
      <div class="stage">
        <div class="pointer"></div>
        <canvas id="wheel"></canvas>
      </div>
      <div class="controls">
        <span class="hint">146 shades</span>
        <button class="btn-spin" id="spinBtn" type="button">Spin</button>
        <span class="hint">tap a wedge</span>
      </div>
    </main>

    <div id="site-footer"></div>
  </div>

  <div class="ciocca-overlay" id="cioccaOverlay">
    <img alt="">
    <div class="win-code" id="winCode"></div>
    <div class="win-name" id="winName"></div>
    <button class="again" id="againBtn" type="button">Spin again</button>
  </div>

      }
      // code nearest the rim (nearest the arrow)
      radialWord(s.code, R-CODE_OFF, "700 "+CODE_FONT+"px 'Helvetica Neue', Arial, sans-serif", s.ink, CODE_MAXLEN);
      ctx.restore();
    }

    // highlight the winning wedge on top
    var wa0 = rot + winner*SLICE, wa1 = wa0 + SLICE;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,R,wa0,wa1); ctx.closePath();
    ctx.strokeStyle = "rgba(255,255,255,.95)"; ctx.lineWidth = 3.5; ctx.stroke();
  }

  /* ====== Loop ====== */
  function tick(){
    if(!dragging && vel!==0){
      rot += vel; vel *= FRICTION;
      if(Math.abs(vel) < STOP_VEL){
        vel = 0;
        if(awaitingResult){ awaitingResult = false; openSchedina(winnerIndex(rot)); }
      }
    }
    draw();
    requestAnimationFrame(tick);
  }

  /* ====== Schedina (enlarged card) ====== */
  var overlay = document.getElementById("cioccaOverlay");
  var overlayImg = overlay.querySelector("img");
  var winCodeEl = document.getElementById("winCode");
  var winNameEl = document.getElementById("winName");

  function openSchedina(i){
    var s = SLICES[i];
    overlayImg.src = "images/" + encodeURIComponent(s.code) + ".jpg";
    overlayImg.alt = s.code;
    winCodeEl.textContent = s.code;
    winNameEl.textContent = s.names[1]; // English name
    overlay.classList.add("show");
  }
  function closeSchedina(){ overlay.classList.remove("show"); }

  overlay.addEventListener("click", function(e){
    if(e.target.id === "againBtn") return;
    closeSchedina();
  });
  document.getElementById("againBtn").addEventListener("click", function(e){
    e.stopPropagation(); closeSchedina(); spin();
  });

  /* ====== Input ====== */
  function getXY(e){ var r = canvas.getBoundingClientRect(); return { x:e.clientX-r.left, y:e.clientY-r.top }; }

  canvas.addEventListener("pointerdown", function(e){
    if(pointerId !== null) return;
    pointerId = e.pointerId; canvas.setPointerCapture(pointerId);
    var p = getXY(e);
    dragging = true; canvas.classList.add("dragging"); vel = 0;
    lastPointerAngle = pointAngle(p.x,p.y); lastMoveTime = performance.now();
    downX=p.x; downY=p.y; downTime=lastMoveTime; movedDist=0;
  });
  canvas.addEventListener("pointermove", function(e){
    if(!dragging || e.pointerId !== pointerId) return;
    var p = getXY(e);
    var a = pointAngle(p.x,p.y), d = a - lastPointerAngle;
    if(d > Math.PI) d -= Math.PI*2; if(d < -Math.PI) d += Math.PI*2;
    rot += d;
    var now = performance.now(), dt = Math.max(1, now - lastMoveTime);
    vel = d * (16/dt);
    lastPointerAngle = a; lastMoveTime = now;
    movedDist = Math.max(movedDist, Math.hypot(p.x-downX, p.y-downY));
  });
  function endDrag(e){
    if(e.pointerId !== pointerId) return;
    dragging = false; canvas.classList.remove("dragging");
    try{ canvas.releasePointerCapture(pointerId); }catch(_){}
    pointerId = null;
    if(movedDist < 8 && (performance.now()-downTime) < 350){
      var p = getXY(e), i = sliceAt(p.x, p.y);
      if(i>=0){ openSchedina(i); vel = 0; return; }
    }
    if(Math.abs(vel) > STOP_VEL*3){
      var maxV = 0.55; if(vel>maxV)vel=maxV; if(vel<-maxV)vel=-maxV;
      awaitingResult = true;
    }
  }
  canvas.addEventListener("pointerup", endDrag);
  canvas.addEventListener("pointercancel", endDrag);

  function spin(){ vel = 0.34 + Math.random()*0.18; awaitingResult = true; }
  document.getElementById("spinBtn").addEventListener("click", spin);

  /* ====== Start ====== */
  function resize(){ layout(); draw(); }
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", function(){ setTimeout(resize,120); });
  layout();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
