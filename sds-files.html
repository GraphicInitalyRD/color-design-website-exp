<style>
  /* ===== pagina SDS Files: parentesi pulsanti impilati, a META' grandezza rispetto a Brochures ===== */
  :root{ --sds-bracket:#E8B0B0; }   /* colore iniziale parentesi (cambia via JS ogni secondo) */

  .broc-box{ position:relative; width:100%; max-width:195px; margin:0 auto; aspect-ratio:390 / 205.2; background:var(--hero-bg); overflow:hidden; }
  .broc-box + .broc-box{ margin-top:6px; }
  .broc-box .crescents{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }

  /* contenuto centrale cliccabile: nome file SDS */
  .broc-content{
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:5px; text-align:center; padding:0 20%;
    text-decoration:none; color:var(--text-white);
  }
  .broc-content .name{ font-size:11px; letter-spacing:.3px; line-height:1.25; }
  .broc-content .name .dl{ font-size:10px; opacity:.85; margin-left:4px; }
  .broc-content:hover .name{ text-decoration:underline; }

  /* parentesi che cambiano colore (via JS) e pulsano TUTTE INSIEME, in continuo e sincronizzate */
  .broc-box .crescents .cres-l, .broc-box .crescents .cres-r{
    transform-box: fill-box;
    transition: fill .6s linear;   /* transizione morbida tra un colore e il successivo */
  }
  .broc-box .cres-l{ animation: brocL 1.3s ease-in-out infinite; }
  .broc-box .cres-r{ animation: brocR 1.3s ease-in-out infinite; }
  @keyframes brocL{ 0%{ transform:translateX(0); } 29%{ transform:translateX(-13px); } 65%,100%{ transform:translateX(0); } }
  @keyframes brocR{ 0%{ transform:translateX(0); } 29%{ transform:translateX(13px); } 65%,100%{ transform:translateX(0); } }
</style>

  <script>
    // Colore delle parentesi: stessa logica dei colori degli stati sulla mappa di Distributors.
    // Ogni secondo OGNI parentesi prende un colore casuale dalla palette, in modo INDIPENDENTE
    // dalle altre e sempre diverso dal proprio colore precedente. Pulsano tutte insieme.
    (function(){
      var PAL=["#E8B0B0","#E8CCB0","#E8E8B0","#CCE8B0","#B0E8B0","#B0E8CC","#B0E8E8","#B0CCE8","#B0B0E8","#CCB0E8","#E8B0E8","#E8B0CC"];
      var boxes=Array.prototype.slice.call(document.querySelectorAll('.broc-box'));
      var cur=boxes.map(function(){ return -1; });
      function step(){
        for(var i=0;i<boxes.length;i++){
          var n; do{ n=(Math.random()*PAL.length)|0; }while(n===cur[i]);
          cur[i]=n;
          boxes[i].style.setProperty('--sds-bracket', PAL[n]);
        }
      }
      step();
      setInterval(step, 1000);
    })();
  </script>
